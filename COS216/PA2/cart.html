<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <script src="js/currency.js" defer></script>
    <script src="js/cart.js" defer></script>
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/navbarlogo.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/logo.css">
    <link rel="stylesheet" href="css/wish_cart_filter.css">
</head>
<body>
    <div id="loader-container">
        <div class="boxes">
            <div class="box"><div></div><div></div><div></div><div></div></div>
            <div class="box"><div></div><div></div><div></div><div></div></div>
            <div class="box"><div></div><div></div><div></div><div></div></div>
            <div class="box"><div></div><div></div><div></div><div></div></div>
        </div>
    </div>

    <!-- Logo Section -->
    <nav class="navbar">
        <div class="logo">
            <div class="shopping-cart">
                <div class="cart-basket"></div>
                <div class="cart-handle"></div>
                <div class="cart-wheels">
                    <div class="wheel"></div>
                    <div class="wheel"></div>
                </div>
            </div>
            <div><h1>ShopEze</h1></div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Products</a></li>
            <li><a href="deals.html">Best Deals</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li class="active"><a href="cart.html">Cart</a></li>
        </ul>
        <br>
    </nav>

    <section class="filter-sort">
        <h6>l</h6>
        <div class="filters">
            <div class="filter-group">
                <label for="currency-dropdown">Select Currency:</label>
                <select id="currency-dropdown">
                    <!-- Populated dynamically by currency.js -->
                </select>
            </div>
        </div>
    </section>

    <div class="cart-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody>
                <!-- Cart items will be dynamically added here -->
            </tbody>
        </table>

        <div class="cart-summary">
            <h2>Cart Summary</h2>
            <p>Subtotal: <span id="subtotal">ZAR 0.00</span></p>
            <p>Grand Total: <span id="grand-total">ZAR 0.00</span></p>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <h3>Find us on</h3>
        <a href="../../under_con.html">www.shopezeonline.com</a>
        <br>
        <div class="socials">
            <a href="../../under_con.html"><i class="fab fa-twitter"></i></a>
            <a href="../../under_con.html"><i class="fab fa-youtube"></i></a>
            <a href="../../under_con.html"><i class="fab fa-facebook"></i></a>
            <a href="../../under_con.html"><i class="fab fa-pinterest"></i></a>
        </div>
        <h3>More about us here:</h3>
        <a href="about.html">ABOUT US</a>
        <br><br>
        ©ShopEze Online (Pty) Ltd
        <br>(All Rights Reserved)
        <br><br>
    </footer>
</body>
</html>
